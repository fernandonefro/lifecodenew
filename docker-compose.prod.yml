services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: lifecode-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-lifecode_prod}
      POSTGRES_USER: ${DB_USER:-lifecode_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:? Obrigatório definir DB_PASSWORD}
      TZ: 'UTC'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lifecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lifecode_admin} -d ${DB_NAME:-lifecode_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. In-Memory Cache & Filas de Alertas (Redis)
  redis:
    image: redis:7-alpine
    container_name: lifecode-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:? Obrigatório definir REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - lifecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Backend NestJS
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lifecode-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-lifecode_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-lifecode_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:? Obrigatório definir JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:? Chave AES-256 de 32 bytes necessária}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lifecode-network

  # 4. Portal Web Next.js
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifecode-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-piloto.lifecode.health}/api/v1
    depends_on:
      - api
    networks:
      - lifecode-network

  # 5. Reverse Proxy Nginx & Terminação TLS/SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: lifecode-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - lifecode-network

networks:
  lifecode-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
